apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: 013234656798/api-gateway:v1
          ports:
            - containerPort: 8090
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"

            - name: AUTH_SERVICE_URL
              value: "http://product-service:9999"

            - name: PRODUCT_SERVICE_URL
              value: "http://node-service:8081"

            - name: PYTHON_SERVICE_URL
              value: "http://python-service:8000"
