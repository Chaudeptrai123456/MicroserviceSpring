server:
  port: 8090
#  ssl:
#    key-store: classpath:keystore.p12
#    key-store-password: 013234656798
#    key-store-type: PKCS12
#    key-alias: tomcat
url: http://localhost:9999/oauth2/jwks
resilience4j:
  timelimiter:
    instances:
      productServiceCb:
        timeoutDuration: 5s
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 50
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 2s
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 10
    instances:
      productServiceCb:
        baseConfig: default
      authServiceCb:
        baseConfig: default
spring:
  application:
    name: gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9999/oauth2/jwks
      # client:
      #   registration:
      #     messenger:
      #       client-id: chau
      #       client-secret: 123   # ⚠️ Chỉ dùng dev, prod phải bảo mật
      #       scope: openid, profile, email
      #       authorization-grant-type: authorization_code
      #       redirect-uri: "{baseUrl}/login/oauth2/code/messenger"
      #   provider:
      #     messenger:
      #       issuer-uri: http://localhost:9999
  cloud:
    gateway:
      default-filters:
        - TokenRelay
      server:
        webflux:
          routes:
            - id: logout
              uri: http://localhost:9999
              predicates:
                - Path=/logout
              filters:
                - name: CircuitBreaker
                  args:
                    name: productServiceCb
                    fallbackUri: forward:/fallback/service
                - name: Retry
                  args:
                    retries: 3
                    statuses: BAD_GATEWAY, GATEWAY_TIMEOUT
                    methods: GET
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userKeyResolver}"
            - id: oauth2-callback
              uri: http://localhost:8090
              predicates:
                - Path=/login/oauth2/code/messenger
              filters:
                - name: CircuitBreaker
                  args:
                    name: productServiceCb
                    fallbackUri: forward:/fallback/service
                - name: Retry
                  args:
                    retries: 3
                    statuses: BAD_GATEWAY, GATEWAY_TIMEOUT
                    methods: GET
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userKeyResolver}"
            - id: product-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/service/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: productServiceCb
                    fallbackUri: forward:/fallback/service
                - name: Retry
                  args:
                    retries: 3
                    statuses: BAD_GATEWAY, GATEWAY_TIMEOUT
                    methods: GET
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userKeyResolver}"
            - id: central-server
              uri: http://localhost:9999
              predicates:
                - Path=/api/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: productServiceCb
                    fallbackUri: forward:/fallback/service
                - name: Retry
                  args:
                    retries: 3
                    statuses: BAD_GATEWAY, GATEWAY_TIMEOUT
                    methods: GET
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userKeyResolver}"
            - id: admin-server
              uri: http://localhost:9999
              predicates:
                - Path=/admin/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: productServiceCb
                    fallbackUri: forward:/fallback/service
                - name: Retry
                  args:
                    retries: 3
                    statuses: BAD_GATEWAY, GATEWAY_TIMEOUT
                    methods: GET
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userKeyResolver}"
            - id: python-service
              uri: http://localhost:8000
              predicates:
                - Path=/search/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: productServiceCb
                    fallbackUri: forward:/fallback/service
                - name: Retry
                  args:
                    retries: 3
                    statuses: BAD_GATEWAY, GATEWAY_TIMEOUT
                    methods: GET,POST
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userKeyResolver}"

management:
  tracing:
    sampling:
      probability: 1.0 # DEV: trace 100%
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    prometheus:
      access: unrestricted
logging:
  level:
    org.springframework.security: DEBUG
    io.github.resilience4j: DEBUG
    org.springframework.cloud.gateway: DEBUG
